<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nguyên tiêu</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .container {
            width: 600px;
            background-color: white;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: red;
        }

        .poem {
            text-align: center;
            font-size: 22px;
            line-height: 1.8;
        }

        .author {
            text-align: right;
            margin-top: 30px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>NGUYÊN TIÊU</h1>

        <div class="poem">
            <p>
                Kim dạ nguyên tiêu nguyệt chính viên,<br>
                Xuân giang xuân thủy tiếp xuân thiên.<br>
                Yên ba thâm xứ đàm quân sự,<br>
                Dạ bán quy lai nguyệt mãn thuyền.
            </p>
        </div>

        <div class="author">
            ĐẶNG THIÊN CÂN – STT 04
        </div>
    </div>
</body>
</html>
